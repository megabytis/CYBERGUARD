:root{--s:calc(min(100vw,100vh)/540);--ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.45,.64,1)}
html,body{height:100%;margin:0}
body{background:#eeefee;overflow:hidden;display:grid;place-items:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage{position:relative;width:540px;height:540px;flex:none;transform:scale(var(--s));transform-origin:center center}
.btn{position:absolute;left:117.5px;top:211.75px;width:305px;height:116px;border-radius:200px;outline:none}
.btn *{pointer-events:none}
/* drop shadows: big soft (idle) / tight (hover) / none (press) */
.sh{position:absolute;inset:0;border-radius:inherit;transition:opacity .5s var(--ease) .05s,transform .45s var(--spring)}
.sh-idle{box-shadow:0 17px 16px rgba(0,0,0,.15),0 62px 63px rgba(0,0,0,.35),0 80px 90px rgba(0,0,0,.06);opacity:1}
.sh-hover{box-shadow:0 3px 4px rgba(0,0,0,.3),0 12px 10px -3px rgba(0,0,0,.5),0 44px 27px rgba(0,0,0,.15);opacity:0;transition:opacity .45s var(--ease),transform .45s var(--spring)}
.btn.hover .sh-idle{opacity:0;transition:opacity .45s var(--ease),transform .45s var(--spring)}
.btn.hover .sh-hover{opacity:1}
.btn.press .sh-idle,.btn.press .sh-hover{opacity:0;transition:opacity .15s var(--ease),transform .12s var(--ease)}
.btn.press .sh,.btn.press .body{transform:scale(.985)}
/* body */
.body{position:absolute;inset:0;border-radius:inherit;overflow:hidden;transition:transform .45s var(--spring);
  background:linear-gradient(to bottom,#000 0,#797979 1.7%,#838383 5%,#969696 8.7%,#9b9b9b 12%,#989898 15.6%,#909090 20%,#808080 24%,#6b6b6b 28.5%,#5c5c5c 33%,#4d4d4d 37%,#414141 42%,#353535 45%,#333 48.5%,#2e2e2e 52%,#2a2a2a 55%,#222 59%,#1e1e1e 62%,#181818 66%,#161616 69%,#111 73%,#101010 76%,#0a0a0a 80%,#080808 83%,#070707 87%,#030303 90%,#020202 93%,#000 96%)}
.btn.press .body{transition:transform .12s var(--ease)}
.grain{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.03) 0,rgba(0,0,0,.1) 5%,rgba(0,0,0,.22) 12%,rgba(0,0,0,.3) 16%,rgba(0,0,0,.5) 20%,rgba(0,0,0,.66) 24%,rgba(0,0,0,.8) 28%,rgba(0,0,0,.88) 33%,rgba(0,0,0,.95) 40%,rgba(0,0,0,.82) 46%,rgba(0,0,0,.72) 52%,rgba(0,0,0,.72) 58%,rgba(0,0,0,.7) 65%,rgba(0,0,0,.7) 69%,rgba(0,0,0,.48) 73%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.38) 85%,rgba(0,0,0,.25) 91%,rgba(0,0,0,0) 96%);
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.03) 0,rgba(0,0,0,.1) 5%,rgba(0,0,0,.22) 12%,rgba(0,0,0,.3) 16%,rgba(0,0,0,.5) 20%,rgba(0,0,0,.66) 24%,rgba(0,0,0,.8) 28%,rgba(0,0,0,.88) 33%,rgba(0,0,0,.95) 40%,rgba(0,0,0,.82) 46%,rgba(0,0,0,.72) 52%,rgba(0,0,0,.72) 58%,rgba(0,0,0,.7) 65%,rgba(0,0,0,.7) 69%,rgba(0,0,0,.48) 73%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.38) 85%,rgba(0,0,0,.25) 91%,rgba(0,0,0,0) 96%)}
/* end shading follows the caps and fades out softly (no hard seam) */
.endl,.endr{position:absolute;inset:0}
.endl{background:radial-gradient(circle 62px at 58px 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.06) 72%,rgba(0,0,0,.14) 78%,rgba(0,0,0,.22) 84%,rgba(0,0,0,.26) 90%,rgba(0,0,0,.32) 95%,rgba(0,0,0,.4) 100%);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 44px,rgba(0,0,0,0) 62px);mask-image:linear-gradient(90deg,#000 0,#000 44px,rgba(0,0,0,0) 62px)}
.endr{background:radial-gradient(circle 62px at calc(100% - 58px) 50%,rgba(0,0,0,0) 74%,rgba(0,0,0,.1) 84%,rgba(0,0,0,.22) 92%,rgba(0,0,0,.45) 100%);
  -webkit-mask-image:linear-gradient(270deg,#000 0,#000 44px,rgba(0,0,0,0) 62px);mask-image:linear-gradient(270deg,#000 0,#000 44px,rgba(0,0,0,0) 62px)}
.rim{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.5px #000}
.label{position:absolute;left:52px;top:-0.75px;height:100%;display:flex;align-items:center;font:340 25.1px/1 "RM","Roboto Mono",ui-monospace,Menlo,monospace;letter-spacing:2px;color:#d0d0d0;white-space:nowrap;transition:color .35s var(--ease) .1s}
.btn.hover .label,.btn.press .label{color:#fff;transition:color .25s var(--ease)}
/* knob: socket + lit gap ring + glass sphere */
.well,.gap,.gapb,.pressdark{position:absolute}
.well,.gap,.gapb{right:12.75px;top:14.5px;width:90.5px;height:90.5px;border-radius:50%}
.well{background:#000}
.gap{background:conic-gradient(from 0deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.07) 40deg,rgba(255,255,255,.3) 75deg,rgba(255,255,255,.47) 90deg,rgba(255,255,255,.3) 105deg,rgba(255,255,255,.18) 120deg,rgba(255,255,255,.1) 150deg,rgba(255,255,255,.06) 180deg,rgba(255,255,255,.1) 210deg,rgba(255,255,255,.18) 240deg,rgba(255,255,255,.3) 255deg,rgba(255,255,255,.47) 270deg,rgba(255,255,255,.3) 285deg,rgba(255,255,255,.07) 320deg,rgba(255,255,255,.05) 360deg);
  -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,0) 42.3px,rgba(0,0,0,.5) 43.2px,#000 44px,#000 45px,rgba(0,0,0,0) 45.6px);mask-image:radial-gradient(circle,rgba(0,0,0,0) 42.3px,rgba(0,0,0,.5) 43.2px,#000 44px,#000 45px,rgba(0,0,0,0) 45.6px)}
.gapb{background:linear-gradient(to top,rgba(255,255,255,.25) 0,rgba(255,255,255,.25) 22%,rgba(255,255,255,0) 50%);
  -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,0) 41.6px,#000 42.4px,#000 45px,rgba(0,0,0,0) 45.6px);mask-image:radial-gradient(circle,rgba(0,0,0,0) 41.6px,#000 42.4px,#000 45px,rgba(0,0,0,0) 45.6px)}
.pressdark{inset:0;border-radius:inherit;box-shadow:inset 0 0 17px 15px rgba(0,0,0,.95);background:linear-gradient(to bottom,rgba(0,0,0,.35) 0,rgba(0,0,0,.25) 10%,rgba(0,0,0,0) 26%);opacity:0;transition:opacity .4s var(--ease)}
.btn.press .pressdark{opacity:1;transition:opacity .12s var(--ease)}
.sphere{position:absolute;right:16px;top:17.75px;width:84px;height:84px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle closest-side at 50% 50%,#0b0c0b 0,#0b0c0b 80%,#070707 90%,#040404 96%,#030303 100%);transition:box-shadow .5s var(--ease)}
.btn.hover .sphere{box-shadow:0 0 3px 0 rgba(20,150,90,.6),0 0 8px 1px rgba(30,200,120,.3)}
.btn.press .sphere{box-shadow:0 0 3px 1px rgba(40,210,130,.8),0 0 10px 2px rgba(60,240,150,.45);transition:box-shadow .12s var(--ease)}
.sph-hover,.sph-press,.rimlite,.rimglow,.glow,.potion{position:absolute;inset:0;border-radius:50%}
.sph-hover{opacity:0;transition:opacity .5s var(--ease);
  background:radial-gradient(ellipse 45% 25% at 50% 24%,rgba(8,14,10,.85) 0,rgba(8,14,10,.75) 55%,rgba(8,14,10,0) 100%),
  linear-gradient(to bottom,rgba(0,40,24,.82) 0,rgba(0,40,24,.58) 6%,rgba(0,40,24,.3) 12%,rgba(0,40,24,0) 22%),
  radial-gradient(ellipse 65% 45% at 50% 100%,rgba(30,200,120,.5) 0,rgba(30,200,120,.28) 50%,rgba(30,200,120,0) 100%),
  radial-gradient(circle closest-side at 50% 50%,#15191a 0,#15191a 43%,#13241d 50%,#123027 57%,#123c2e 64%,#124a37 71%,#125a40 79%,#147a50 86%,#14925c 93%,#1fa86a 100%)}
.btn.hover .sph-hover{opacity:1;transition:opacity .4s var(--ease)}
.sph-press{opacity:0;transition:opacity .3s var(--ease);
  background:radial-gradient(ellipse 45% 25% at 50% 24%,rgba(8,16,12,.85) 0,rgba(8,16,12,.75) 55%,rgba(8,16,12,0) 100%),
  linear-gradient(to bottom,rgba(0,60,35,.75) 0,rgba(0,60,35,.55) 6%,rgba(0,60,35,.3) 12%,rgba(0,60,35,0) 22%),
  radial-gradient(ellipse 65% 45% at 50% 100%,rgba(40,230,140,.55) 0,rgba(40,230,140,.32) 50%,rgba(40,230,140,0) 100%),
  radial-gradient(circle closest-side at 50% 50%,#101a15 0,#101a15 36%,#0f2a1e 43%,#0f3626 50%,#0f442f 57%,#0f5a3c 64%,#0f6c47 71%,#128757 79%,#16a869 86%,#18c078 93%,#28d48a 100%)}
.btn.press .sph-press{opacity:1;transition:opacity .12s var(--ease)}
.potion{width:84px;height:84px;opacity:.85}
.glow{opacity:0;transition:opacity .5s var(--ease);
  background:radial-gradient(circle closest-side at 50% 50%,rgba(130,255,195,0) 75%,rgba(130,255,195,.32) 88%,rgba(100,235,170,.4) 100%);
  -webkit-mask-image:linear-gradient(to top,#000 0,#000 30%,rgba(0,0,0,0) 50%);mask-image:linear-gradient(to top,#000 0,#000 30%,rgba(0,0,0,0) 50%)}
.btn.hover .glow,.btn.press .glow{opacity:1;transition:opacity .4s var(--ease)}
.rimlite,.rimglow{-webkit-mask-image:linear-gradient(to top,#000 0,#000 10%,rgba(0,0,0,.5) 18%,rgba(0,0,0,.18) 32%,rgba(0,0,0,0) 50%);mask-image:linear-gradient(to top,#000 0,#000 10%,rgba(0,0,0,.5) 18%,rgba(0,0,0,.18) 32%,rgba(0,0,0,0) 50%)}
.rimlite{background:radial-gradient(circle at 50% 50%,rgba(220,232,226,0) 27px,rgba(220,232,226,.25) 31px,rgba(220,232,226,.6) 34px,rgba(220,232,226,.97) 37px,rgba(220,232,226,.6) 39.5px,rgba(220,232,226,.45) 42px);transition:opacity .5s var(--ease)}
.btn.hover .rimlite,.btn.press .rimlite{opacity:0}
.rimglow{background:radial-gradient(circle at 50% 50%,rgba(150,255,205,0) 30px,rgba(150,255,205,.5) 32.5px,rgba(150,255,205,.9) 33.5px,rgba(160,255,210,1) 36.5px,rgba(90,235,160,.4) 39.5px,rgba(70,220,145,.3) 42px);opacity:0;transition:opacity .5s var(--ease)}
.btn.hover .rimglow,.btn.press .rimglow{opacity:1;transition:opacity .4s var(--ease)}
.blob{position:absolute;left:24.5px;top:4.75px;width:35px;height:35px;border-radius:50%;filter:blur(.5px);
  background:linear-gradient(to bottom,rgba(255,255,255,.33) 0,rgba(255,255,255,.19) 40%,rgba(255,255,255,.07) 75%,rgba(255,255,255,.02) 100%);transition:opacity .4s var(--ease)}
.btn.hover .blob,.btn.press .blob{opacity:.78}
.ring{position:absolute;inset:0;opacity:0;transform:scale(.86);transition:opacity .35s var(--ease),transform .45s var(--ease)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:spin 2.93s linear infinite}
.ring circle{fill:none;stroke:rgba(205,255,228,.62);stroke-width:1.15;stroke-dasharray:5 3;transition:stroke .2s var(--ease),stroke-width .2s var(--ease)}
.btn.hover .ring{opacity:1;transform:scale(1);transition:opacity .35s var(--ease) .08s,transform .55s var(--spring) .08s}
.btn.press .ring{opacity:1;transform:scale(1);transition:opacity .12s var(--ease),transform .12s var(--ease)}
.btn.press .ring circle{stroke:#d6ff5c;stroke-width:1.4}
@keyframes spin{to{transform:rotate(360deg)}}
/* envelope icon */
.icon{position:absolute;inset:0}
.icon svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mail{transform:translate(42px,40px)}
.mail path,.mail rect,.mail line{fill:none;stroke:rgba(255,255,255,.42);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round;transition:stroke .4s var(--ease)}
.btn.hover .mail path,.btn.hover .mail rect,.btn.hover .mail line,.btn.press .mail path,.btn.press .mail rect,.btn.press .mail line{stroke:rgba(228,255,240,.96)}
.mail .env{fill:rgba(5,12,9,.66)}
.mail .flapo{transform:scaleY(0);opacity:0;transform-origin:0 -7.5px;transition:transform .45s var(--spring),opacity .2s var(--ease)}
.mail .flapc{transform-origin:0 -7.5px;transition:transform .3s var(--ease),opacity .2s var(--ease) .05s}
.mail .letter{transform:translateY(0);opacity:1;transition:transform .5s var(--spring) .05s,opacity .3s var(--ease)}
.mail .letter rect{fill:rgba(18,26,22,.95)}
.mail .letter line{stroke-width:1.2;stroke:rgba(255,255,255,.32)}
.btn.hover .mail .letter line{stroke:rgba(200,255,225,.7)}
.btn.hover .mail .flapc{opacity:0;transform:scaleY(.15)}
.btn.hover .mail .flapo{opacity:1;transform:scaleY(1)}
.btn.hover .mail .letter{transform:translateY(-9px);animation:bob 2.6s ease-in-out .6s infinite}
.btn.sent .mail .letter{transform:translateY(-34px);opacity:0;transition:transform .38s cubic-bezier(.45,0,.85,.5),opacity .2s var(--ease) .15s;animation:none}
.btn.press .mail .flapo{transform:scaleY(1.08)}
@keyframes bob{0%,100%{transform:translateY(-9px)}50%{transform:translateY(-11.5px)}}
/* fingerprints */
.prints{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.print{position:absolute;width:110px;height:140px;left:0;top:0;opacity:0;transform:scale(.96);transition:opacity .22s var(--ease),transform .32s var(--ease)}
.print.show{opacity:.32;transform:scale(1)}
.print.fade{opacity:0;transition:opacity .8s var(--ease)}
.print canvas{position:absolute;inset:0;width:110px;height:140px;display:block}
</style>
</head>
<body>
<div class="stage">
  <div class="btn" id="btn" role="button" tabindex="0" aria-label="Sign up">
    <div class="sh sh-idle"></div>
    <div class="sh sh-hover"></div>
    <div class="body">
      <div class="grain" id="grain"></div>
      <div class="endl"></div>
      <div class="endr"></div>
      <div class="rim"></div>
      <div class="well"></div>
      <div class="gap"></div>
      <div class="gapb"></div>
      <div class="pressdark"></div>
      <div class="sphere">
        <div class="sph-hover"></div>
        <div class="sph-press"></div>
        <canvas class="potion" id="potion" width="168" height="168"></canvas>
        <div class="glow"></div>
        <div class="rimlite"></div>
        <div class="rimglow"></div>
        <div class="blob"></div>
        <div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="35"/></svg></div>
        <div class="icon"><svg viewBox="0 0 84 84"><g class="mail">
          <path class="flapo" d="M-11,-7.5 L0,-16 L11,-7.5"/>
          <g class="letter"><rect x="-7.5" y="-5" width="15" height="12" rx="1.5"/><line x1="-4.5" y1="-1.5" x2="4.5" y2="-1.5"/><line x1="-4.5" y1="1.8" x2="2" y2="1.8"/></g>
          <rect class="env" x="-11" y="-7.5" width="22" height="15" rx="2.5"/>
          <path class="flapc" d="M-11,-5.5 L0,2.5 L11,-5.5"/>
        </g></svg></div>
      </div>
      <div class="label">SIGN UP</div>
      <div class="prints" id="prints"></div>
    </div>
  </div>
</div>
<script>
(function(){
  const btn=document.getElementById('btn'), prints=document.getElementById('prints'), grainEl=document.getElementById('grain');
  const stage=document.querySelector('.stage');
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  /* grain texture: 2x speckle field with a skewed brightness distribution */
  (function makeGrain(){
    const W=Math.round(btn.offsetWidth*2),H=Math.round(btn.offsetHeight*2),c=document.createElement('canvas');c.width=W;c.height=H;
    const g=c.getContext('2d'),img=g.createImageData(W,H),d=img.data,r=mulberry32(1337);
    for(let i=0;i<W*H;i++){const u=r();const a=0.30*Math.pow(u,1.7);d[i*4]=255;d[i*4+1]=255;d[i*4+2]=255;d[i*4+3]=Math.round(a*255)}
    g.putImageData(img,0,0);grainEl.style.backgroundImage='url('+c.toDataURL()+')';
  })();
  /* potion: liquid with rising bubbles and sparkles inside the glass sphere */
  const potion=(function(){
    const cv=document.getElementById('potion'),S=84,D=2,g=cv.getContext('2d');g.scale(D,D);
    const rnd=mulberry32(4242);
    function np(init){return{x:8+rnd()*68,y:init?26+rnd()*54:80+rnd()*5,r:.35+rnd()*rnd()*1.6,v:.05+rnd()*.15,ph:rnd()*6.28,sw:.25+rnd()*.7,a:.3+rnd()*.7}}
    const P=[];for(let i=0;i<46;i++)P.push(np(true));
    let glow=0,target=0,level=52,tLevel=52,t=0,last=performance.now(),burst=[],running=false;
    const surf=x=>level+Math.sin(x*.18+t*2.1)*1.1+Math.sin(x*.31-t*1.4)*.7;
    function draw(dt){
      t+=dt/60;glow+=(target-glow)*Math.min(1,.07*dt);level+=(tLevel-level)*Math.min(1,.05*dt);
      g.clearRect(0,0,S,S);
      g.beginPath();g.moveTo(-2,surf(-2));for(let x=1;x<=S+2;x+=3)g.lineTo(x,surf(x));g.lineTo(S+2,S+2);g.lineTo(-2,S+2);g.closePath();
      const A=.32+glow*.45,lg=g.createLinearGradient(0,level-4,0,S);
      lg.addColorStop(0,'rgba(70,225,150,'+A+')');lg.addColorStop(.35,'rgba(22,150,92,'+(A*.9)+')');lg.addColorStop(1,'rgba(4,42,28,'+(A*.85)+')');
      g.fillStyle=lg;g.fill();
      g.beginPath();for(let x=-2;x<=S+2;x+=2){const y=surf(x);x===-2?g.moveTo(x,y):g.lineTo(x,y)}
      g.strokeStyle='rgba(175,255,215,'+(.25+glow*.45)+')';g.lineWidth=1;g.stroke();
      g.globalCompositeOperation='lighter';
      for(const p of P){
        p.y-=p.v*dt*(1+glow*.7);p.x+=Math.sin(t*p.sw*3+p.ph)*.12*dt;
        if(p.y<surf(p.x)+1.5)Object.assign(p,np(false));
        const al=p.a*(.3+glow*.7)*Math.min(1,(S-p.y)/6);
        g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fillStyle='rgba(165,255,208,'+al+')';g.shadowColor='rgba(120,255,190,.9)';g.shadowBlur=3+glow*4;g.fill();
      }
      g.shadowBlur=0;
      for(let i=0;i<7;i++){const x=14+((i*11.3+t*4*(i%2?1:-1)+300)%56);const y=level-6-((i*7+t*6)%Math.max(8,level-14));const tw=.5+.5*Math.sin(t*5+i*1.7);
        g.beginPath();g.arc(x,y,.6+tw*.5,0,6.283);g.fillStyle='rgba(195,255,225,'+((.12+glow*.5)*tw)+')';g.fill()}
      for(let i=burst.length-1;i>=0;i--){const b=burst[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=.02*dt;b.l-=dt/38;if(b.l<=0){burst.splice(i,1);continue}
        g.beginPath();g.arc(b.x,b.y,b.r*b.l,0,6.283);g.fillStyle='rgba(205,255,228,'+(.9*b.l)+')';g.shadowColor='rgba(120,255,190,.9)';g.shadowBlur=4;g.fill()}
      g.shadowBlur=0;g.globalCompositeOperation='source-over';
    }
    function frame(now){const dt=Math.min(40,now-last)/16.67;last=now;draw(dt);requestAnimationFrame(frame)}
    function start(){if(running)return;running=true;last=performance.now();requestAnimationFrame(frame)}
    draw(1);start();
    return{set(s){target=s==='press'?1.3:s==='hover'?1:0;tLevel=s==='idle'?52:47},
      burst(){for(let i=0;i<18;i++){const a=-Math.PI/2+(rnd()-.5)*1.5,sp=.7+rnd()*1.5;burst.push({x:42+(rnd()-.5)*22,y:level+8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:.8+rnd()*1.4,l:1})}},
      step(n){for(let i=0;i<n;i++)draw(1)}};
  })();
  /* fingerprint generator: ridge field (loop / whorl / arch) rasterised with domain warping, breaks and pressure falloff */
  function makePrint(seed){
    const r=mulberry32(seed);const W=110,H=140,D=2;
    const c=document.createElement('canvas');c.width=W*D;c.height=H*D;const g=c.getContext('2d');
    const LS=32,latA=new Float32Array(LS*LS),latB=new Float32Array(LS*LS);
    for(let i=0;i<LS*LS;i++){latA[i]=r()*2-1;latB[i]=r()*2-1}
    function vn(lat,x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
      const x0=((xi%LS)+LS)%LS,x1=(x0+1)%LS,y0=((yi%LS)+LS)%LS,y1=(y0+1)%LS;
      return (lat[y0*LS+x0]*(1-sx)+lat[y0*LS+x1]*sx)*(1-sy)+(lat[y1*LS+x0]*(1-sx)+lat[y1*LS+x1]*sx)*sy}
    function fbm(lat,x,y){return vn(lat,x,y)*.6+vn(lat,x*2.1+3.7,y*2.1+1.3)*.28+vn(lat,x*4.3+9.1,y*4.3+5.2)*.12}
    const ss=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
    const tr=r(),type=tr<.58?'loop':(tr<.85?'whorl':'arch');
    const cx=55,cy=48,sp=2.55+r()*.45,wAmp=3.5+r()*3.5,wF=1/(34+r()*10);
    const tilt=(r()-.5)*.4,ct=Math.cos(tilt),st=Math.sin(tilt);
    const spiral=r()<.5?0:(r()<.5?1:-1),ell=1.05+r()*.2,archA=10+r()*6,archS=15+r()*8,diverge=.002+r()*.003;
    const img=g.createImageData(W*D,H*D),d=img.data;
    for(let py=0;py<H*D;py++)for(let px=0;px<W*D;px++){
      const x=px/D,y=py/D;
      const wx=x+fbm(latA,x*wF,y*wF)*wAmp,wy=y+fbm(latB,x*wF+5,y*wF+7)*wAmp;
      const dx=wx-cx,dy=wy-cy,ux=dx*ct-dy*st,uy=dx*st+dy*ct;
      let f;
      if(type==='loop'){f=uy<0?Math.hypot(ux,uy):Math.abs(ux)/(1+uy*diverge)+0}
      else if(type==='whorl'){f=Math.hypot(ux,uy/ell)+spiral*Math.atan2(uy,ux)*sp/(2*Math.PI)}
      else{f=uy+archA*Math.exp(-(ux*ux)/(archS*archS))}
      const ph=2*Math.PI*f/sp,ridge=ss(-.12,.5,Math.cos(ph));
      const br=fbm(latB,x*.11+40,y*.11+40),cut=ss(-.52,-.34,br);
      const ex=(x-cx)/43,ey=(y-cy-16)/58,re=Math.hypot(ex,ey);
      const en=fbm(latA,x*.05+20,y*.05+20)*.16,mask=ss(1.08+en,.78+en,re);
      const pr=.55+.45*(1-Math.min(1,re)),gr=.82+.18*vn(latA,x*.9+11,y*.9+3);
      const a=Math.min(1,ridge*cut*mask*pr*gr+mask*.05);
      const o=(py*W*D+px)*4;d[o]=255;d[o+1]=255;d[o+2]=255;d[o+3]=Math.round(a*255);
    }
    g.putImageData(img,0,0);
    return c;
  }
  let seed=7;
  function addPrint(x,y,rot,hold){
    const el=document.createElement('div');el.className='print';seed+=1;
    const cv=makePrint(seed);cv.style.transform='rotate('+rot+'deg)';cv.style.transformOrigin='55px 55px';el.appendChild(cv);
    el.style.left=(x-55-2)+'px';el.style.top=(y-48-15)+'px';el.style.transformOrigin='55px 55px';
    prints.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
    if(hold===Infinity){el.classList.add('show')}else{setTimeout(()=>el.classList.add('fade'),hold);setTimeout(()=>el.remove(),hold+900)}
    return el;
  }
  /* interaction */
  let pressed=false,sentTimer=0;const rnd=mulberry32(99);
  function setState(){potion.set(btn.classList.contains('press')?'press':btn.classList.contains('hover')?'hover':'idle')}
  function localPoint(e){const r=stage.getBoundingClientRect();const s=r.width/540;const br=btn.getBoundingClientRect();return{x:(e.clientX-br.left)/s,y:(e.clientY-br.top)/s}}
  function release(withPrint,e){
    if(!pressed)return;pressed=false;btn.classList.remove('press');
    if(withPrint){const p=e?localPoint(e):{x:btn.offsetWidth*.45,y:btn.offsetHeight*.5};addPrint(p.x,p.y,-35+rnd()*70,3000);potion.burst();
      btn.classList.add('sent');clearTimeout(sentTimer);sentTimer=setTimeout(()=>btn.classList.remove('sent'),480)}
    setState();
  }
  btn.addEventListener('pointerenter',()=>{btn.classList.add('hover');setState()});
  btn.addEventListener('pointerleave',()=>{btn.classList.remove('hover');release(false);setState()});
  btn.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;pressed=true;btn.classList.add('press');btn.classList.add('hover');setState();try{btn.setPointerCapture(e.pointerId)}catch(_){}});
  btn.addEventListener('pointerup',e=>release(true,e));
  btn.addEventListener('pointercancel',()=>release(false));
  btn.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){if(!pressed){pressed=true;btn.classList.add('press');setState()}e.preventDefault()}});
  btn.addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&pressed)release(true,null)});
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  /* test hooks: #hover #press #fp */
  const h=location.hash.replace('#','');
  if(h){
    const st=document.createElement('style');st.textContent='*{transition:none!important}';document.head.appendChild(st);
    if(h.includes('hover'))btn.classList.add('hover');
    if(h.includes('press')){btn.classList.add('hover');btn.classList.add('press')}
    if(h.includes('fp')){const n=parseInt(h.replace(/.*fp/,''))||1;for(let i=0;i<n;i++)addPrint(60+i*62,50+(i%2)*30,-30+i*25,Infinity)}
    setState();potion.step(60);
  }
  window.__btn={addPrint,btn,potion};
})();
</script>
</body>
</html>
