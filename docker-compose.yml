services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./data/cyberguard.db
      - SECRET_KEY=cyberguard-enterprise-secret-key-32-chars-long-soc-2026
      - DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL:-analyst@cyberguard.internal}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-CyberGuard2026!SecOps}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguard_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
